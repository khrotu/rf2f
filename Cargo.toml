[package]
name = "rf2f"
version = "0.1.0"
edition = "2021"
authors = ["rf2f contributors"]
description = "Fast, local, multi-format file conversion tool with Windows right-click context menu integration"
license = "MIT OR Apache-2.0"
[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
image = { version = "0.25", default-features = true }
anyhow = "1.0"
thiserror = "2.0"
rayon = "1.10"
walkdir = "2.5"
tempfile = "3.16"
winreg = "0.52"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
indicatif = "0.17"
console = "0.15"
which = "7.0"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_System_Registry", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
